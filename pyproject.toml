[project]
name = "geologs"
version = "0.1.1"
description = "A self-hosted, multi-user location archive: stays, trips, places, reminders and MCP tools, on PostgreSQL and PostGIS"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Karun Shrestha" }]
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1", "psycopg[binary,pool]>=3.2,<4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
# The browser tests (tests/e2e); also run `playwright install chromium` once.
browser-tests = ["playwright>=1.48"]

[project.urls]
Repository = "https://github.com/karunstha/geologs"
Issues = "https://github.com/karunstha/geologs/issues"

[project.scripts]
geologs = "geologs.presentation.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"geologs.presentation" = ["web/*.html", "web/*.js", "web/*.webmanifest", "web/icons/*.png", "web/css/*.css", "web/css/*/*.css", "web/js/*.js", "web/js/*/*.js", "web/ha/*.yaml"]
