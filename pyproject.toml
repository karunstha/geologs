[project]
name = "geotracker"
version = "0.1.0"
description = "Source-independent personal location memory, reminders, and MCP tools"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
geotracker = "geotracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geotracker = ["web/*"]
