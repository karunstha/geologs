[project]
name = "geologs"
version = "0.1.0"
description = "Source-independent personal location memory, reminders, and MCP tools"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1", "psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
# Kept so older install commands ('.[postgres]') still work; PostgreSQL is now always required.
postgres = []

[project.scripts]
geologs = "geologs.presentation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"geologs.presentation" = ["web/*.html", "web/css/*.css", "web/css/*/*.css", "web/js/*.js", "web/js/*/*.js", "web/ha/*.yaml"]
