name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: geologs
          POSTGRES_PASSWORD: test
          POSTGRES_DB: geologs
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U geologs -d geologs"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GEOLOGS_TEST_DATABASE_URL: postgresql://geologs:test@127.0.0.1:55432/geologs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'tag must match pyproject.toml'
          assert f'"{version}"' in pathlib.Path('src/geologs/__init__.py').read_text()
          PY
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Check browser modules
        run: find src/geologs/presentation/web/js -name '*.js' -exec node --check '{}' \;

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          provenance: mode=max
          sbom: true
          build-args: |
            GEOLOGS_VERSION=${{ github.event.release.tag_name }}
            VCS_REF=${{ github.sha }}
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign release image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
