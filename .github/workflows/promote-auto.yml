name: Promote auto-update release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tested, published release tag (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: auto-update
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Verify and promote
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          docker pull "${IMAGE}@${DIGEST}"
          REVISION=$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$REVISION" = "$(git rev-parse "${TAG}^{commit}")"
          if docker buildx imagetools inspect "${IMAGE}:stable-auto" >/dev/null 2>&1; then
            docker pull "${IMAGE}:stable-auto"
            PREVIOUS=$(docker image inspect "${IMAGE}:stable-auto" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
            [[ "$PREVIOUS" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            git merge-base --is-ancestor "$PREVIOUS" "$TAG"
            python - "$PREVIOUS" "$TAG" <<'PY'
          import sys
          def parts(value): return tuple(map(int, value[1:].split('.')))
          if parts(sys.argv[2]) <= parts(sys.argv[1]):
              raise SystemExit('auto-update release must be newer than current channel')
          PY
            if ! git diff --quiet "$PREVIOUS" "$TAG" -- \
              docker-compose.yaml db.Dockerfile .env.example src/geologs/data/postgres.py src/geologs/data/database.py; then
              echo 'Deployment configuration or database upgrade code changed; release needs manual upgrade.' >&2
              exit 1
            fi
          fi
          docker buildx imagetools create --tag "${IMAGE}:stable-auto" "${IMAGE}@${DIGEST}"
