services:
  db:
    build:
        context: .
        dockerfile: db.Dockerfile
    container_name: geologs-db
    image: geologs-db
    platform: linux/amd64
    environment:
      POSTGRES_DB: geologs
      POSTGRES_USER: geologs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geologs -d geologs"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "0.0.0.0:15432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOLOGS_DATABASE_URL: postgresql://geologs@db:5432/geologs
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GEOLOGS_TOKEN: ${GEOLOGS_TOKEN:?Set GEOLOGS_TOKEN in .env}
      GEOLOGS_TOKEN_FILE: /config/.env
      GEOLOGS_TIMEZONE: ${GEOLOGS_TIMEZONE:-UTC}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GEOLOGS_PHOTON_URL: ${GEOLOGS_PHOTON_URL:-}
      GEOLOGS_WEBHOOK_URL: ${GEOLOGS_WEBHOOK_URL:-}
      GEOLOGS_WEBHOOK_TOKEN: ${GEOLOGS_WEBHOOK_TOKEN:-}
      GEOLOGS_WEBHOOK_SECRET: ${GEOLOGS_WEBHOOK_SECRET:-}
      # US fuel prices for Car & fuel (Automatic); without it you enter your own price.
      EIA_API_KEY: ${EIA_API_KEY:-}
      # A photo of your city behind History (free key: https://unsplash.com/developers).
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      GEOLOGS_REVERSE_CACHE_DAYS: ${GEOLOGS_REVERSE_CACHE_DAYS:-180}
    ports:
      - "0.0.0.0:${GEOLOGS_PUBLISHED_PORT:-8765}:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/config/.env:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
