services:
  db:
    build:
        context: .
        dockerfile: db.Dockerfile
        platform: linux/amd64
    container_name: geotracker-db
    image: geotracker-db
    platform: linux/amd64
    environment:
      POSTGRES_DB: geotracker
      POSTGRES_USER: geotracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotracker -d geotracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports:
      - "0.0.0.0:15432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOTRACKER_DATABASE_URL: postgresql://geotracker@db:5432/geotracker
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GEOTRACKER_TOKEN: ${GEOTRACKER_TOKEN:?Set GEOTRACKER_TOKEN in .env}
      GEOTRACKER_TOKEN_FILE: /config/.env
      GEOTRACKER_TIMEZONE: ${GEOTRACKER_TIMEZONE:-UTC}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOTRACKER_PHOTON_URL: ${GEOTRACKER_PHOTON_URL:-}
      GEOTRACKER_WEBHOOK_URL: ${GEOTRACKER_WEBHOOK_URL:-}
      GEOTRACKER_WEBHOOK_TOKEN: ${GEOTRACKER_WEBHOOK_TOKEN:-}
      GEOTRACKER_WEBHOOK_SECRET: ${GEOTRACKER_WEBHOOK_SECRET:-}
    ports:
      - "0.0.0.0:${GEOTRACKER_PUBLISHED_PORT:-8765}:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/config/.env:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
